<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpler Snap Carousel</title>
  <link rel="stylesheet" href="css/carousel.css">
</head>
<body>
  <div class="carousel" id="places">
    <button class="nav prev" aria-label="Previous" hidden>‹</button>

    <div class="track" id="places-track">
      <figure class="item"><img src="carousel_img/Photo1.png"  alt="Photo 1"></figure>
      <figure class="item"><img src="carousel_img/Photo2.png"  alt="Photo 2"></figure>
      <figure class="item"><img src="carousel_img/Photo3.png"  alt="Photo 3"></figure>
      <figure class="item"><img src="carousel_img/Photo4.png"  alt="Photo 4"></figure>
      <figure class="item"><img src="carousel_img/Photo5.png"  alt="Photo 5"></figure>
      <figure class="item"><img src="carousel_img/Photo6.png"  alt="Photo 6"></figure>
      <figure class="item"><img src="carousel_img/Photo7.png"  alt="Photo 7"></figure>
      <figure class="item"><img src="carousel_img/Photo8.png"  alt="Photo 8"></figure>
      <figure class="item"><img src="carousel_img/Photo9.png"  alt="Photo 9"></figure>
      <figure class="item"><img src="carousel_img/Photo10.png" alt="Photo 10"></figure>
      <figure class="item"><img src="carousel_img/Photo11.png" alt="Photo 11"></figure>
      <figure class="item"><img src="carousel_img/Photo12.png" alt="Photo 12"></figure>
      <figure class="item"><img src="carousel_img/Photo13.png" alt="Photo 13"></figure>
      <figure class="item"><img src="carousel_img/Photo14.png" alt="Photo 14"></figure>
    </div>

    <button class="nav next" aria-label="Next">›</button>
  </div>

  <script src="js/carousel.js"></script>
</body>
</html>
