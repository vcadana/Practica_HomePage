<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canva</title>
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- css y js de navbar -->
        <link rel="stylesheet" href="css/navbar.css">
        <script type="text/javascript" src="js/navbar.js"></script>
        <!-- logo pie de pagina -->
        <link rel="icon" href="IMG/logo_pagina.jpg">
        <!--fuentes de google-->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Navbar con bootstrap -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <!--estiliza el elemento como marca-->
                <a class="navbar-brand" href="#"><img src="IMG/canva.png"></a>

                <!--boton responsive-->
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent"
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!--"colapse" activa la funcion de colapsar
                #navbarContente" mostrar y ocultar-->

                <!--en este div se maneja el menu nav-->
                <div class="collapse navbar-collapse"
                    id="navbarContent">

                    <!--el ul es la barra horizontal del menu-->
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link"              href="#">Diseño</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"              href="#">Producto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"              href="#">Planes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"              href="#">Empresas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"              href="#">Educación</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"              href="#">Ayuda</a>
                        </li>
                    </ul>
                </div>

                    <!-- boton de registro y login -->
                <div class="navbar-buttons">
                    <button class="btn btn-registrer me-2">Regístrate</button>
                    <button class="btn btn-login">Iniciar sesión</button>
                </div>
            </div>
        </nav>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
