<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canva</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <!-- CSS DEL TRABAJO -->
        <link rel="stylesheet" href="componentes/navbar/css/navbar.css">
        <link rel="stylesheet" href="componentes/cards/css/cards.css">
        <link rel="stylesheet" href="componentes/carousel/css/carousel.css">
        <link rel="stylesheet" href="componentes/hero/css/hero.css">
        <link rel="stylesheet" href="componentes/footer/css/footer.css">
        <link rel="stylesheet" href="componentes/formulario/css/formulario.css">
        <link rel="stylesheet" href="css/formulario.css">

        <!-- logo pie de pagina -->
        <link rel="icon" href="componentes/navbar/IMG/logo_pie_pagina.png">

        <!--fuentes de google-->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet">
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet">
    </head>

   <body>
    <div class="formularioCanva">
        <div class="container-fluid">
            <div class="row align-items-center">
                <!-- Columna del formulario (izquierda) -->
                <div class="col-md-6"> 
                    <div class="estilo_formulario">
                        <div class="encabezadoForm">
                            <h3 class="contactar">Contáctanos para otras consultas:</h3>
                        </div>
                        <form class="formulario" action="*">
                            <div class="mb-3">
                                <label class="form-label">Introduzca su nombre y apellido:</label>
                                <input class="form-control relleno" type="text" name="nombre">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Introduzca su e-mail:</label>
                                <input class="form-control relleno" type="text" name="email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cuéntanos que tipo de diseño necesitas:</label>
                                <textarea class="form-control" name="consulta" rows="5"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <input class="envio w-100" type="submit" value="Enviar">
                                </div>
                                <div class="col-md-6 mb-2">
                                    <input class="borro w-100" type="reset" value="Borrar">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Columna del video (derecha) -->
                <div class="col-md-6">
                    <div class="apartadoVideo">
                        <video autoplay muted loop class="w-100">
                            <source src="video/intFormulario.mp4" type="video/mp4">
                            Tu navegador no soporta el elemento video.
                        </video>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
